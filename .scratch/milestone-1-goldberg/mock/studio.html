<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio – Goldberg x² screen (design mock)</title>
<style>
/* ---------- tokens (palette validated with the dataviz validator; see ticket 01) ---------- */
:root {
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --axis:#c3c2b7; --grid:#e1e0d9;
  --hair:rgba(11,11,11,.14); --wash:#f1f0ec;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s7:#4a3aa7;
  --on-s1:#fff; --flip:#c44a14; --good:#006300;
  --seq1:#cde2fb; --seq2:#9ec5f4; --seq3:#6da7ec; --seq4:#3987e5;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --axis:#383835; --grid:#2c2c2a;
    --hair:rgba(255,255,255,.16); --wash:#262624;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s7:#9085e9; --flip:#f08a5d; --good:#0ca30c;
    --seq1:#184f95; --seq2:#1c5cab; --seq3:#2a78d6; --seq4:#6da7ec;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --axis:#383835; --grid:#2c2c2a;
  --hair:rgba(255,255,255,.16); --wash:#262624;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s7:#9085e9; --flip:#f08a5d; --good:#0ca30c;
  --seq1:#184f95; --seq2:#1c5cab; --seq3:#2a78d6; --seq4:#6da7ec;
}

* { box-sizing: border-box; }
html, body { margin:0; background:#2b2b2b; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
#chrome { position:fixed; top:0; left:0; right:0; z-index:50; display:flex; gap:6px; flex-wrap:wrap; align-items:center;
  padding:6px 10px; background:#111; color:#eee; font:13px system-ui, sans-serif; }
#chrome b { color:#ffb300; margin-right:8px; }
#chrome button { background:#333; color:#eee; border:1px solid #555; border-radius:4px; padding:3px 8px; font:13px system-ui; cursor:pointer; }
#chrome button.on { background:#2a78d6; border-color:#2a78d6; }
#chrome .sep { width:1px; height:18px; background:#555; margin:0 4px; }
#wrap { margin-top:40px; overflow:auto; }
#screen { width:1920px; height:1080px; transform-origin:0 0; position:relative; overflow:hidden;
  background:var(--page); color:var(--ink); font-size:20px; line-height:1.3; }
#screen.nochrome { margin-top:0; }

/* ---------- top ribbon ---------- */
#top { position:absolute; left:0; top:0; width:1920px; height:84px; display:flex; align-items:center; gap:24px; padding:0 24px;
  background:var(--surface); border-bottom:1px solid var(--hair); }
#brand { width:430px; }
#brand .t { font-size:26px; font-weight:700; }
#brand .s { font-size:20px; color:var(--ink2); }
#ribbon { display:flex; flex:1; gap:0; }
.stage { flex:1; height:56px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:22px; font-weight:600;
  color:var(--ink2); background:var(--wash); clip-path:polygon(0 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 0 100%, 22px 50%);
  margin-left:-10px; padding:0 22px; }
.stage:first-child { margin-left:0; clip-path:polygon(0 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 0 100%); }
.stage.done { color:var(--ink); }
.stage.cur { background:var(--acc); color:var(--on-acc); }
.stage .n { font-weight:700; }
#gen { width:300px; text-align:right; }
#gen .g { font-size:30px; font-weight:700; }
#gen .l { font-size:20px; color:var(--ink2); }

/* ---------- transport ---------- */
#transport { position:absolute; left:0; top:84px; width:1920px; height:72px; display:flex; align-items:center; gap:9px; padding:0 24px;
  background:var(--surface); border-bottom:1px solid var(--hair); }
.btn { height:48px; padding:0 11px; border:2px solid var(--ink2); border-radius:8px; background:var(--surface); color:var(--ink);
  font:600 20px system-ui,"Segoe UI",sans-serif; display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
.btn kbd { font:600 16px ui-monospace,Consolas,monospace; color:var(--ink2); border:1px solid var(--axis); border-radius:4px; padding:0 6px; background:var(--wash); }
.btn.primary { background:var(--acc); border-color:var(--acc); color:var(--on-acc); }
.btn.primary kbd { color:#fff; background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.5); }
.btn.quiet { border-color:var(--axis); }
.vsep { width:2px; height:36px; background:var(--axis); margin:0 6px; }
#tier { display:flex; align-items:center; gap:10px; }
#tier .track { position:relative; width:240px; height:10px; background:var(--grid); border-radius:5px; }
#tier .stop { position:absolute; top:-5px; width:20px; height:20px; border-radius:50%; background:var(--surface); border:2px solid var(--ink2); transform:translateX(-10px); }
#tier .stop.cur { background:var(--acc); border-color:var(--acc); }
#tier .labels { display:flex; justify-content:space-between; width:340px; font-size:18px; color:var(--ink2); margin-top:4px; }
#seedbox { display:flex; align-items:center; gap:8px; color:var(--ink2); }
#seedbox b { color:var(--ink); }

/* ---------- panels ---------- */
.panel { position:absolute; background:var(--surface); border:1px solid var(--hair); border-radius:10px; overflow:hidden; }
.ph { display:flex; align-items:baseline; justify-content:space-between; padding:10px 16px 8px; border-bottom:1px solid var(--hair); }
.ph h2 { margin:0; font-size:22px; font-weight:700; }
.ph .r { font-size:20px; color:var(--ink2); }
table { border-collapse:collapse; width:100%; font-size:21px; }
th { text-align:left; font-weight:600; color:var(--ink2); font-size:19px; padding:6px 10px; border-bottom:2px solid var(--axis); white-space:nowrap; }
td { padding:0 10px; height:44px; border-bottom:1px solid var(--grid); white-space:nowrap; }
td.num, th.num { text-align:right; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-weight:700; letter-spacing:.14em; font-size:25px; }
tr.hl td { background:var(--acc-tint); }
tr.dim td { color:var(--ink2); }
.sym { display:inline-block; min-width:1.3em; text-align:center; font-weight:700; }
.muted { color:var(--ink2); }
.pending { color:var(--ink2); font-style:italic; }

/* bits */
.bits { display:inline-flex; gap:4px; vertical-align:middle; }
.bit { width:36px; height:44px; display:inline-flex; align-items:center; justify-content:center; border:2px solid var(--ink2); border-radius:6px;
  font:700 27px ui-monospace,"Cascadia Mono",Consolas,monospace; background:var(--surface); position:relative; }
.bit.sm { width:30px; height:38px; font-size:23px; }
.bit.hatch { background-image:repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--ink2) 55%, transparent) 5px 7px); }
.bit.flip { border-color:var(--flip); border-width:3px; box-shadow:0 5px 0 -1px var(--flip); }
.bit.flip::after { content:"✱"; position:absolute; top:-17px; left:50%; transform:translateX(-50%); color:var(--flip); font-size:18px; }
.bit.cutafter { margin-right:10px; }
.bit.cutafter::before { content:""; position:absolute; right:-11px; top:-10px; bottom:-10px; border-right:3px dashed var(--ink); }

/* badges */
.badge { display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:19px; border-radius:6px; padding:2px 10px; border:2px solid var(--ink2); }
.badge.bypass { border-style:dashed; background:var(--wash); }
.badge.ok { border-color:var(--good); color:var(--good); }
.badge.flip { border-color:var(--flip); color:var(--flip); }
.badge.x { border-color:var(--ink2); color:var(--ink2); text-decoration:none; }

/* stage panel body */
#stagebody { position:absolute; left:16px; right:16px; top:84px; bottom:80px; }
#narr { position:absolute; left:16px; right:16px; bottom:12px; height:58px; display:flex; align-items:center; gap:12px; padding:0 14px;
  background:var(--wash); border-left:6px solid var(--acc); border-radius:6px; font-size:21px; line-height:1.2; }
#narr .m { font-weight:700; white-space:nowrap; color:var(--ink2); }
#legend { position:absolute; left:24px; top:722px; width:800px; height:26px; display:flex; justify-content:space-between; font-size:19px; color:var(--ink2); align-items:center; }
#legend b { color:var(--ink); }
.chip { flex:1; border:2px solid var(--ink2); border-radius:8px; padding:4px 10px; text-align:center; font-size:20px; white-space:nowrap; }
.chip.cur { border-width:4px; background:var(--acc-tint); font-weight:700; }
.chip.future { border-style:dashed; color:var(--ink2); }

.note { font-size:20px; color:var(--ink2); }
.card { border:2px solid var(--ink2); border-radius:8px; padding:8px 12px; background:var(--surface); }
.row { display:flex; align-items:center; gap:14px; }
.flow { display:flex; align-items:stretch; gap:34px; height:100%; }
.col { flex:1; display:flex; flex-direction:column; gap:8px; min-width:0; }
.col h3 { margin:0 0 4px; font-size:21px; color:var(--ink2); font-weight:700; }
.arrow { align-self:center; font-size:40px; color:var(--ink2); }

/* plots */
svg text { font-family: system-ui,"Segoe UI",sans-serif; fill:var(--ink2); font-size:18px; }
svg text.ink { fill:var(--ink); }
svg .ax { stroke:var(--axis); stroke-width:1; }
svg .gr { stroke:var(--grid); stroke-width:1; }

/* drawer + dialog */
#drawer { position:absolute; right:0; top:156px; bottom:0; width:640px; background:var(--surface); border-left:2px solid var(--ink2);
  box-shadow:-12px 0 30px rgba(0,0,0,.25); overflow:hidden; z-index:20; }
#drawer .dh { height:56px; display:flex; justify-content:space-between; align-items:center; padding:0 18px; border-bottom:1px solid var(--hair); font-size:24px; font-weight:700; }
#drawer { overflow-y:auto; }
#drawer .sec { padding:6px 18px 4px; border-bottom:1px solid var(--grid); }
#drawer .sec h4 { margin:0 0 2px; font-size:20px; }
#drawer .ctl { display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:19px; line-height:1.15; }
#drawer .help { font-size:17px; color:var(--ink2); margin:0 0 2px; line-height:1.2; }
.field { border:2px solid var(--ink2); border-radius:6px; padding:0 10px; font-weight:600; min-width:90px; text-align:center; background:var(--surface); }
.switch { display:inline-flex; align-items:center; gap:8px; font-weight:700; }
.switch i { width:46px; height:24px; border-radius:12px; background:var(--acc); position:relative; display:inline-block; }
.switch i::after { content:""; position:absolute; right:3px; top:3px; width:18px; height:18px; border-radius:50%; background:#fff; }
.tag { font-size:16px; font-weight:700; border-radius:4px; padding:0 6px; border:2px solid var(--ink2); }
.tag.reset { border-style:dashed; }
.tag.pend { border-color:var(--flip); color:var(--flip); }
#dim { position:absolute; inset:0; background:rgba(0,0,0,.5); z-index:30; }
#dialog { position:absolute; left:230px; top:300px; width:800px; z-index:40; background:var(--surface); border:3px solid var(--ink); border-radius:12px; padding:24px 28px; }
#dialog h3 { margin:0 0 10px; font-size:28px; }
#dialog p { margin:0 0 18px; font-size:22px; }
#dialog .acts { display:flex; justify-content:flex-end; gap:14px; }

#caption { position:fixed; left:10px; bottom:6px; z-index:60; background:#111c; color:#fff; font:13px system-ui; padding:4px 8px; border-radius:4px; max-width:70vw; }
body.shot #chrome, body.shot #caption { display:none; }
body.shot #wrap { margin-top:0; }
/* =====================================================================
   STUDIO — the chosen direction. Light by default, with a dark theme from the same tokens.
   Data colours (--s1 --s2 --s3 --s7) are the validated plot palette in both themes and are
   never used for chrome; chrome uses --acc (violet), which is deliberately unlike the plot blue.
   ===================================================================== */
#tier .labels { margin-top:12px !important; }
#brand { display:flex; align-items:center; gap:14px; }
.mono { font-variant-ligatures:none; }

:root, :root[data-theme="light"] {
  color-scheme:light;
  --page:#f1f2f9; --page2:#e9ecf8; --surface:#ffffff; --ink:#141a33; --ink2:#586081; --axis:#ccd1e6; --grid:#eceef7; --hair:rgba(20,26,51,.09); --wash:#f4f5fb;
  --line:#dadff0; --line-soft:#eef0f8; --chip:#eef0f9; --th:#6f7799; --knob:#ffffff;
  --elev:0 1px 2px rgba(20,26,51,.05), 0 14px 34px rgba(20,26,51,.07); --bar-shadow:0 1px 0 rgba(20,26,51,.06), 0 12px 32px rgba(20,26,51,.05);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s7:#4a3aa7;
  --acc:#7040ec; --acc-ink:#4a24b8; --acc-tint:#efe9ff; --on-acc:#ffffff; --acc-glow:rgba(112,64,236,.38); --logo:linear-gradient(135deg,#8b5cf6,#6d4aea);
  --bit-bg:#ffffff; --bit-line:#c9cee5; --bit-ink:#7a82a6; --one-bg:#ddd3ff; --one-line:#8a68f0; --one-ink:#36199e; --hatch:rgba(112,64,236,.34);
  --ok-bg:#dcf4e6; --ok-ink:#0b6b36; --flip:#d6470e; --flip-bg:#ffe9dc; --flip-ink:#b3400a; --good:#0b6b36;
  --seq1:#ece6ff; --seq2:#cbbdff; --seq3:#a590fa; --seq4:#7c5df0;
  --veil:rgba(20,26,51,.5); --drawer-shadow:-18px 0 50px rgba(20,26,51,.22);
}
:root[data-theme="dark"] {
  color-scheme:dark;
  --page:#0c1022; --page2:#10152c; --surface:#171c36; --ink:#eef0ff; --ink2:#a9b1d4; --axis:#323a66; --grid:#222a50; --hair:rgba(150,160,255,.16); --wash:#1d2342;
  --line:#2d3562; --line-soft:#232a4f; --chip:#1d2342; --th:#8a93bd; --knob:#eef0ff;
  --elev:0 1px 2px rgba(0,0,0,.3), 0 14px 34px rgba(0,0,0,.38); --bar-shadow:0 1px 0 rgba(150,160,255,.12), 0 12px 32px rgba(0,0,0,.3);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s7:#9085e9;
  --acc:#a78bfa; --acc-ink:#dcd1ff; --acc-tint:rgba(167,139,250,.17); --on-acc:#160d3a; --acc-glow:rgba(167,139,250,.35); --logo:linear-gradient(135deg,#c4b5fd,#8b5cf6);
  --bit-bg:#0f1430; --bit-line:#323a66; --bit-ink:#8a93bd; --one-bg:rgba(167,139,250,.24); --one-line:#a78bfa; --one-ink:#efe9ff; --hatch:rgba(196,181,253,.5);
  --ok-bg:rgba(74,222,128,.14); --ok-ink:#86efac; --flip:#fb923c; --flip-bg:rgba(251,146,60,.16); --flip-ink:#fdba74; --good:#4ade80;
  --seq1:#4a3a9c; --seq2:#5d49bd; --seq3:#7058d6; --seq4:#8a6ff0;
  --veil:rgba(2,4,14,.6); --drawer-shadow:-18px 0 50px rgba(0,0,0,.55);
}

#screen { background:linear-gradient(180deg,var(--page) 0%,var(--page2) 100%); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
#top { background:var(--surface); border-bottom:none; box-shadow:var(--bar-shadow); z-index:2; }
#transport { background:transparent; border-bottom:none; }
.logo { display:inline-flex; flex:none; width:52px; height:52px; border-radius:16px; align-items:center; justify-content:center; background:var(--logo); color:var(--on-acc); font:800 24px system-ui; box-shadow:0 8px 18px var(--acc-glow); }
:root[data-theme="dark"] .logo { color:#160d3a; }
#brand .t { font-size:25px; letter-spacing:-.01em; }
#brand .s { font-size:19px; }

/* stage tracker */
#ribbon { background:var(--chip); border-radius:999px; padding:5px; gap:4px; }
.stage, .stage:first-child { clip-path:none; margin-left:0; border-radius:999px; background:transparent; height:50px; font-size:21px; font-weight:650; color:var(--ink2); padding:0 12px; gap:10px; }
.stage .n { width:30px; height:30px; border-radius:50%; background:var(--surface); color:var(--ink2); display:inline-flex; align-items:center; justify-content:center; font-size:17px; box-shadow:0 1px 3px rgba(20,26,51,.16); }
.stage.done { color:var(--ink); }
.stage.done .n { background:var(--ok-bg); color:var(--ok-ink); box-shadow:none; }
.stage.cur { background:var(--acc); color:var(--on-acc); box-shadow:0 8px 22px var(--acc-glow); }
.stage.cur .n { background:rgba(255,255,255,.26); color:inherit; box-shadow:none; }
#gen .g { color:var(--acc); font-weight:800; font-size:32px; letter-spacing:-.02em; }

/* controls */
.btn { border:1.5px solid var(--line); border-radius:14px; background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(20,26,51,.05); }
.btn.primary { background:var(--acc); border-color:var(--acc); color:var(--on-acc); box-shadow:0 8px 18px var(--acc-glow); }
.btn.quiet { background:transparent; box-shadow:none; border-color:transparent; color:var(--ink2); }
.btn kbd { border-radius:6px; background:var(--wash); border-color:var(--line); color:var(--ink2); }
.btn.primary kbd { background:rgba(255,255,255,.22); border-color:rgba(255,255,255,.42); color:inherit; }
.vsep { background:var(--line); width:1.5px; }
#tier .track { height:8px; background:var(--line); }
#tier .stop { border-color:var(--axis); background:var(--surface); }
#tier .stop.cur { background:var(--acc); border-color:var(--acc); box-shadow:0 0 0 4px var(--acc-tint); }
.field { border:1.5px solid var(--line); border-radius:10px; background:var(--surface); }
.switch i { background:var(--acc); }

/* panels */
.panel { background:var(--surface); border:none; border-radius:22px; box-shadow:var(--elev); }
.ph { border-bottom:none; }
.ph:not([style]) { padding:14px 22px 6px; }
.ph h2 { font-weight:700; letter-spacing:-.01em; }
.ph h2::before { content:""; display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--acc); margin-right:10px; vertical-align:1px; }
th { border-bottom:none; font-size:18px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; color:var(--th); padding:6px 12px; }
td { border-bottom:1px solid var(--line-soft); padding:0 12px; }
tbody tr:last-child td { border-bottom:none; }
tr.hl td { background:var(--acc-tint); }
tr.hl td:first-child { border-radius:14px 0 0 14px; }
tr.hl td:last-child { border-radius:0 14px 14px 0; }

/* chromosomes: a 1 must stand out from a 0 by weight, fill AND border, never by tint alone */
.bit { border:1.5px solid var(--bit-line); border-radius:11px; background-color:var(--bit-bg); color:var(--bit-ink); font-weight:600; }
.bit.one { background-color:var(--one-bg); border:2px solid var(--one-line); color:var(--one-ink); font-weight:800; }
.bit.hatch { background-image:repeating-linear-gradient(135deg, transparent 0 5px, var(--hatch) 5px 7px); }
.bit.flip { border-color:var(--flip); background-color:var(--flip-bg); color:var(--flip); box-shadow:0 5px 0 -1px var(--flip); }
.bit.cutafter::before { border-right:3px dashed var(--acc); }

.badge { border:none; border-radius:999px; padding:3px 13px; background:var(--chip); color:var(--ink2); }
.badge.ok { background:var(--ok-bg); color:var(--ok-ink); }
.badge.flip { background:var(--flip-bg); color:var(--flip-ink); }
.badge.bypass { background:var(--wash); border:1.5px dashed var(--axis); }
.card { background:var(--surface); border:1.5px solid var(--line); border-radius:18px; box-shadow:0 1px 2px rgba(20,26,51,.04); }
.chip { background:var(--surface); border:1.5px solid var(--line); border-radius:999px; }
.chip.cur { border-width:1.5px; border-color:var(--acc); background:var(--acc-tint); color:var(--acc-ink); }
#narr { background:var(--acc-tint); border-left:none; border-radius:18px; color:var(--ink); }
#narr .m { color:var(--acc-ink); }
.tag { border-color:var(--ink2); }
.tag.pend { border-color:var(--flip); color:var(--flip-ink); }

/* drawer and dialog */
#drawer { background:var(--surface); border-left:none; border-radius:22px 0 0 22px; box-shadow:var(--drawer-shadow); }
#drawer .sec { border-bottom-color:var(--line-soft); }
#dim { background:var(--veil); }
#dialog { background:var(--surface); border:none; border-radius:22px; box-shadow:0 30px 80px rgba(0,0,0,.4); }

/* plots and scrub bar */
svg text { fill:var(--ink2); }
svg text.ink { fill:var(--ink); }
svg .gr { stroke:var(--grid); }

</style>
</head>
<body>
<div id="chrome"></div>
<div id="wrap"><div id="holder"><div id="screen"></div></div></div>
<div id="caption"></div>

<script>
/* =====================================================================
   THROWAWAY MOCK. Hand-made data for one generation of the textbook
   population, with elitism (e=1) and offspring truncation (λ=4) switched
   on so every stage feature appears once. Nothing here is engine code.
   ===================================================================== */
const STAGES = ['Selection','Pairing','Crossover','Mutation','Evaluation','Replacement'];
const POP = [
  {i:1,c:'01101',x:13,f:169},{i:2,c:'11000',x:24,f:576},{i:3,c:'01000',x:8,f:64},{i:4,c:'10011',x:19,f:361}];
const SUM = 1170;
POP.forEach((p,k)=>{ p.prob = p.f/SUM; p.lo = POP.slice(0,k).reduce((a,q)=>a+q.f,0)/SUM; p.hi = p.lo+p.prob; });

/* ---------- helpers ---------- */
const bits = (s, o={}) => `<span class="bits">${[...s].map((b,k)=>{
  const cls=['bit']; if(b==='1') cls.push('one'); if(o.sm) cls.push('sm'); if(o.hatch&&o.hatch[k]) cls.push('hatch'); if(o.flip&&o.flip.includes(k)) cls.push('flip');
  if(o.cut===k+1) cls.push('cutafter'); return `<b class="${cls.join(' ')}">${b}</b>`; }).join('')}</span>`;
const f3 = v => v.toFixed(3);

/* ---------- left column: population + offspring ---------- */
function popPanel(st){
  const s=STATES[st], stg=s.stage;
  let counts={1:0,2:0,3:0,4:0};
  if(st==='selection'){ SPINS.slice(0,2).forEach(x=>counts[x.to]++); } else if(stg>=1){ POOL.forEach(i=>counts[i]++); }
  const hlRows = st==='selection'?[1]:[]; // spin 2 landed on individual 1
  const elite = stg===5 ? 2 : 0;
  return `<div class="panel" style="${box(G.pop)}">
    <div class="ph"><h2>Population · generation ${CUR_GEN}</h2><span class="r">Σ fitness ${SUM} · avg 292.5 · best 576</span></div>
    <table><thead><tr><th>#</th><th>Chromosome</th><th class="num">x</th>${G.compactPop?'':'<th class="num">x²</th>'}<th class="num">Fitness</th><th class="num">Weight</th><th class="num">Prob.</th><th>Parent</th></tr></thead><tbody>
    ${POP.map(p=>`<tr class="${hlRows.includes(p.i)?'hl':''}"><td><span class="sym">${p.i===elite?'★':''}</span>${p.i}</td><td>${bits(p.c,{sm:true})}</td><td class="num">${p.x}</td>${G.compactPop?'':`<td class="num">${p.f}</td>`}<td class="num">${p.f}</td><td class="num">${p.f}</td><td class="num">${f3(p.prob)}</td>
      <td>${stg===0&&st!=='selection'?'':(counts[p.i]?`<span class="sym">◆</span>×${counts[p.i]}`:(stg>=1||st==='selection'?'<span class="muted">—</span>':''))}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function offPanel(st){
  const stg=STATES[st].stage;
  const rows = OFF.map(o=>{
    const known = stg>=2, mutKnown = stg>=3, scored = stg>=4, fate = stg>=5;
    const chrom = known ? bits(mutKnown?o.post:o.pre,{sm:true,flip:(mutKnown&&o.mut)?[1]:[]}) : '<span class="pending">not yet created</span>';
    const origin = known ? `<span class="muted">${o.origin}${(mutKnown&&o.mut)?', mutated':''}</span>` : '';
    return `<tr class="${(st==='mutation'&&o.k===3)||(st==='evaluation'&&o.k===4)?'hl':''}"><td>O${o.k}</td><td>${chrom}</td><td>${origin}</td><td class="num">${scored?o.x:'—'}</td><td class="num">${scored?o.f:'—'}</td>
      <td>${fate?(o.keep?`<span class="badge ok" style="font-size:17px">✓ kept #${o.rank}</span>`:`<span class="badge x" style="font-size:16px;padding:2px 6px">✕ discarded #${o.rank}</span>`):''}</td></tr>`;}).join('');
  return `<div class="panel" style="${box(G.off)}">
    <div class="ph"><h2>Offspring</h2><span class="r">λ = 4 generated · best 3 survive</span></div>
    <table style="table-layout:fixed"><colgroup>${G.offCols}</colgroup>
    <thead><tr><th>#</th><th>Chromosome</th><th>Origin</th><th class="num">x</th><th class="num">Fitness</th><th>Fate</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- right column: stage views ---------- */
function wheel(){
  const cx=170, cy=170, R=150, shades=['var(--seq1)','var(--seq3)','var(--seq2)','var(--seq4)'];
  const pt=(t,r)=>[cx+r*Math.sin(2*Math.PI*t), cy-r*Math.cos(2*Math.PI*t)];
  let svg=`<svg width="360" height="350" viewBox="0 0 340 340">`;
  POP.forEach((p,k)=>{ const [x1,y1]=pt(p.lo,R),[x2,y2]=pt(p.hi,R); const large=p.prob>.5?1:0;
    svg+=`<path d="M${cx},${cy} L${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} Z" fill="${shades[k]}" stroke="var(--surface)" stroke-width="3"/>`;
    const [lx,ly]=pt((p.lo+p.hi)/2, k===2?R+22:R*.62);
    svg+=`<text class="ink" x="${lx}" y="${ly+7}" text-anchor="middle" style="font-weight:700;font-size:22px;fill:var(--ink)">${p.i}</text>`; });
  svg+=`<circle cx="${cx}" cy="${cy}" r="8" fill="var(--ink)"/>`;
  SPINS.forEach((sp,n)=>{ const [x,y]=pt(sp.r,R+6), [x0,y0]=pt(sp.r,R-26); const done=n<2, cur=n===1;
    svg+=`<g opacity="${done?1:.4}"><line x1="${x0}" y1="${y0}" x2="${x}" y2="${y}" stroke="var(--ink)" stroke-width="${cur?4:2}"/>
      <circle cx="${x}" cy="${y}" r="${cur?15:12}" fill="${cur?'var(--s2)':'var(--surface)'}" stroke="var(--ink)" stroke-width="2"/>
      <text x="${x}" y="${y+6}" text-anchor="middle" style="font-weight:700;font-size:17px;fill:${cur?'#fff':'var(--ink)'}">${n+1}</text></g>`; });
  return svg+`</svg>`;
}
function selectionView(){
  return `<div class="row" style="align-items:flex-start;gap:22px">
    <div style="width:350px">${wheel()}<div class="note" style="text-align:center;margin-top:-10px;font-size:18px">slice size = probability · pins = spins</div></div>
    <div style="flex:1;min-width:0">
      <div class="card" style="margin-bottom:8px;padding:6px 12px"><b>raw fitness → Identity → weight → probability</b> (weight ÷ 1170)
        <div class="note" style="font-size:18px">Fitness ≥ 0, so no shift was needed. <u>Change chain…</u> · Tournament would ignore this chain.</div></div>
      <table><thead><tr><th>Ind.</th><th class="num">Weight</th><th class="num">Prob.</th><th>Interval of r</th></tr></thead><tbody>
      ${POP.map(p=>`<tr class="${p.i===1?'hl':''}"><td style="height:38px">${p.i}</td><td class="num">${p.f}</td><td class="num">${f3(p.prob)}</td><td>[${p.lo.toFixed(3)}, ${p.hi.toFixed(3)})</td></tr>`).join('')}</tbody></table>
      <div class="row" style="gap:8px;margin-top:12px">${SPINS.map((s,n)=>`<div class="chip ${n===1?'cur':''} ${n>1?'future':''}">${n<2?`${n+1}: r = ${s.r.toFixed(2)} → ${s.to}`:`${n+1}: not drawn`}</div>`).join('')}</div>
    </div></div>`;
}
function pairingView(){
  const slot=(n,i)=>`<div class="card" style="width:196px;text-align:center;padding:6px 8px"><div class="note" style="font-size:18px">slot ${n} ← ind. ${i}</div>${bits(byI(i).c,{sm:true})}<div class="note">x = ${byI(i).x}</div></div>`;
  return `<div class="row" style="gap:22px;justify-content:center;margin-top:10px">
    ${[[0,1],[2,3]].map(([a,b],pn)=>`<div style="border:3px solid var(--ink2);border-radius:12px;padding:10px 12px;${pn===1?'background:var(--wash)':''}">

      <div class="row" style="gap:8px">${slot(a+1,POOL[a])}<span style="font-size:28px">⇄</span>${slot(b+1,POOL[b])}</div></div>`).join('')}</div>
    <div class="note" style="margin-top:26px;text-align:center">Mating pool (selection order): ${POOL.map(i=>`<b>${i}</b>`).join(' · ')}.
      Individual 2 appears twice because selection draws with replacement. Individual 3 (01000) was never selected.</div>
    <div class="note" style="margin-top:10px;text-align:center">With an odd pool size, the last pair’s second child would be shown as dropped here.</div>`;
}
function crossoverView(){
  const A=byI(2).c, B=byI(1).c, a2=byI(4).c, b2=byI(2).c;
  const hatch1k1=[0,0,0,0,1], hatch1k2=[1,1,1,1,0];
  return `<div class="flow" style="gap:28px;height:calc(100% - 54px)">
   <div class="col card" style="padding:12px 14px"><div style="font-weight:700;font-size:22px">Pair 1 <span class="badge ok">✓ recombine</span></div>
    <div class="note">u = 0.41 &lt; pc = 0.80 → cut after gene 4 (cut point drawn: 4)</div>
    <div class="row"><span class="muted" style="width:90px">Parent A</span>${bits(A,{cut:4})}<span class="muted">ind. 2</span></div>
    <div class="row"><span class="muted" style="width:90px">Parent B</span>${bits(B,{cut:4,hatch:[1,1,1,1,1]})}<span class="muted">ind. 1</span></div>
    <div class="note" style="text-align:center;font-weight:700">↓ ✂ cut after gene 4 ↓</div>
    <div class="row"><span style="width:90px;font-weight:700">Child 1</span>${bits('11001',{cut:4,hatch:hatch1k1})}<span class="muted">O1</span></div>
    <div class="row"><span style="width:90px;font-weight:700">Child 2</span>${bits('01100',{cut:4,hatch:hatch1k2})}<span class="muted">O2</span></div></div>
   <div class="col card" style="padding:12px 14px;border-style:dashed;background:var(--wash)"><div style="font-weight:700;font-size:22px">Pair 2 <span class="badge bypass">⤼ BYPASS</span> <span class="muted">◂ current</span></div>
    <div class="note">u = 0.93 ≥ pc = 0.80 → no recombination; copies pass through</div>
    <div class="row"><span class="muted" style="width:90px">Parent A</span>${bits(a2)}<span class="muted">ind. 4</span></div>
    <div class="row"><span class="muted" style="width:90px">Parent B</span>${bits(b2,{hatch:[1,1,1,1,1]})}<span class="muted">ind. 2</span></div>
    <div style="text-align:center;font-size:22px;font-weight:700;line-height:1.3">⤼ copied unchanged ⤼</div>
    <div class="row"><span style="width:90px;font-weight:700">Child 3</span>${bits('10011')}<span class="muted">O3 = copy of A</span></div>
    <div class="row"><span style="width:90px;font-weight:700">Child 4</span>${bits('11000',{hatch:[1,1,1,1,1]})}<span class="muted">O4 = copy of B</span></div></div></div>
   <div class="note" style="margin-top:8px"><b>Plain</b> gene = inherited from parent A · <b>hatched</b> gene = inherited from parent B · dashed line = cut point. If crossover were switched off, both pairs would look like pair 2.</div>`;
}
function mutationView(){
  const head=`<tr><th>Offspring</th>${[1,2,3,4,5].map(g=>`<th class="num">gene ${g}</th>`).join('')}<th>Result</th></tr>`;
  const rows=OFF.map((o,n)=>{ const cur=o.k===3, future=o.k===4;
    return `<tr class="${cur?'hl':''} ${future?'dim':''}"><td>O${o.k} <span class="mono" style="font-size:21px;letter-spacing:.1em">${o.pre}</span></td>
    ${DRAWS[n].map((u,g)=>{ const hit=u<PM; return `<td class="num" style="${hit?'font-weight:700;color:var(--flip);outline:3px solid var(--flip);outline-offset:-3px':''}">${future?'<span class="pending">…</span>':u.toFixed(2)}${hit&&!future?' ✱':''}</td>`; }).join('')}
    <td>${future?'<span class="pending">not yet drawn</span>':(o.mut?`${bits(o.post,{sm:true,flip:[1]})} <span class="badge flip">✱ gene 2: 0→1</span>`:`<span class="muted">unchanged</span>`)}</td></tr>`; }).join('');
  return `<div class="note" style="margin-bottom:8px">Table cells are the draws u. A flip needs <b>u &lt; pm = 0.05</b> (marked ✱ and outlined).</div>
    <table style="table-layout:fixed"><colgroup><col style="width:250px">${'<col style="width:74px">'.repeat(5)}<col></colgroup><thead>${head}</thead><tbody>${rows}</tbody></table>
    <div class="note" style="margin-top:10px">Mode: <b>per gene</b> – one draw per gene (20 draws per generation here). A <i>per-individual</i> mode would draw once per offspring first. Switching mutation off would show every row as a bypass.</div>`;
}
function evaluationView(){
  return `<table><thead><tr><th>Offspring</th><th>Chromosome</th><th class="num">x</th><th class="num">f(x) = x²</th><th class="num">Fitness</th></tr></thead><tbody>
  ${OFF.map(o=>`<tr class="${o.k===4?'hl':''}"><td>O${o.k}</td><td>${bits(o.post,{sm:true,flip:o.mut?[1]:[]})}</td><td class="num">${o.x}</td><td class="num">${o.x}² = ${o.f}</td><td class="num"><b>${o.f}</b></td></tr>`).join('')}</tbody></table>
  <div class="note" style="margin-top:10px">Generation 1 population is already scored; only the offspring need evaluating. Evaluations so far: 8.</div>`;
}
function replacementView(){
  const line=(c,txt,o={})=>`<div class="card row" style="padding:5px 10px;gap:10px;white-space:nowrap;${o.dash?'border-style:dashed;':''}${o.thick?'border-width:4px;':''}"><span class="sym" style="min-width:24px">${o.star?'★':''}</span>${bits(c,{sm:true,flip:o.flip?[1]:[]})}<span class="muted">${txt}</span>${o.badge||''}</div>`;
  const ranked=[...OFF].sort((a,b)=>a.rank-b.rank).map(o=>line(o.post,`#${o.rank} · ${o.f}`,{flip:o.mut,dash:!o.keep,badge:o.keep?'<span class="badge ok" style="font-size:17px;padding:0 6px">✓ kept</span>':'<span class="badge x" style="font-size:17px;padding:0 6px">✕ discarded</span>'})).join('');
  const next=[['11000','576',{star:1}],['11011','729',{flip:1}],['11001','625',{}],['11000','576',{}]].map(([c,t,o])=>line(c,t,o)).join('');
  return `<div class="flow" style="gap:14px">
   <div class="col" style="flex:0 0 250px"><h3>Elite (e = 1)</h3>${line('11000','576',{star:1,thick:1})}<div class="note" style="font-size:18px">Top 1 of generation 1, copied unchanged. Ties go to the lower index.</div></div>
   <div class="arrow" style="font-size:34px">+</div>
   <div class="col" style="flex:0 0 384px"><h3>Offspring ranked by fitness</h3>${ranked}<div class="note" style="font-size:18px">Keep the best N − e = 3. Ties: order of generation.</div></div>
   <div class="arrow" style="font-size:34px">→</div>
   <div class="col" style="flex:1;min-width:0"><h3>Generation 2</h3>${next}<div class="note" style="font-size:18px">★ elite, then O3, O1, O4 · Σ 2506 · avg 626.5 · best 729 (was 576)</div></div></div>`;
}
function legendBar(){

function stagePanel(st){

function linePath(arr, X, Y, from=0, to=arr.length-1){ return arr.slice(from,to+1).map((v,k)=>`${k?'L':'M'}${X(from+k)},${Y(v)}`).join(' '); }
function fitnessPlot(){
  const W=800,H=198, L=66,Rt=780,T=24,B=H-30; const X=g=>L+(Rt-L)*g/15, Y=v=>B-(B-T)*v/1000;
  let s=`<svg width="${W}" height="${H}">`;
  [0,250,500,750,1000].forEach(v=>{ s+=`<line class="gr" x1="${L}" x2="${Rt}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-8}" y="${Y(v)+6}" text-anchor="end">${v}</text>`; });
  [0,3,6,9,12,15].forEach(g=>{ s+=`<text x="${X(g)}" y="${H-10}" text-anchor="middle">${g}</text>`; });
  s+=`<text x="${(L+Rt)/2}" y="${H+2}" text-anchor="middle" style="display:none">generation</text>`;
  s+=`<line x1="${L}" x2="${Rt}" y1="${Y(961)}" y2="${Y(961)}" stroke="var(--ink2)" stroke-width="1.5" stroke-dasharray="2 5"/><text x="${Rt}" y="${Y(961)-6}" text-anchor="end" style="font-size:16px">optimum 961</text>`;
  // min-max band
  const up=HIST.max.map((v,g)=>`${g?'L':'M'}${X(g)},${Y(v)}`).join(' '), dn=HIST.min.map((v,g)=>[X(g),Y(v)]).reverse().map(([x,y])=>`L${x},${y}`).join(' ');
  s+=`<path d="${up} ${dn} Z" fill="var(--s1)" opacity=".07"/><clipPath id="nowclip"><rect x="0" y="0" width="${X(CUR_GEN)}" height="${H}"/></clipPath><path d="${up} ${dn} Z" fill="var(--s1)" opacity=".14" clip-path="url(#nowclip)"/>`;
  const draw=(arr,col,dash,mk)=>{
    s+=`<path d="${linePath(arr,X,Y,CUR_GEN,LAST_GEN)}" fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="${dash}" opacity=".3"/>`;
    s+=`<path d="${linePath(arr,X,Y,0,CUR_GEN)}" fill="none" stroke="${col}" stroke-width="2.5" stroke-dasharray="${dash}"/>`;
    arr.forEach((v,g)=>{ const o=g<=CUR_GEN?1:.3; const x=X(g),y=Y(v);
      if(mk==='sq') s+=`<rect x="${x-5}" y="${y-5}" width="10" height="10" fill="${col}" stroke="var(--surface)" stroke-width="2" opacity="${o}"/>`;
      else if(mk==='tri') s+=`<path d="M${x},${y-7} L${x+7},${y+5} L${x-7},${y+5} Z" fill="${col}" stroke="var(--surface)" stroke-width="2" opacity="${o}"/>`;
      else s+=`<circle cx="${x}" cy="${y}" r="5" fill="${col}" stroke="var(--surface)" stroke-width="2" opacity="${o}"/>`; }); };
  draw(HIST.avg,'var(--s1)','0','c'); draw(HIST.so,'var(--s3)','7 4','tri'); draw(HIST.best,'var(--s2)','0','sq');
  s+=`<line x1="${X(CUR_GEN)}" x2="${X(CUR_GEN)}" y1="${T}" y2="${B}" stroke="var(--ink)" stroke-width="2"/><text class="ink" x="${X(CUR_GEN)+6}" y="${T+14}" style="font-weight:700;font-size:16px">now</text>`;
  return s+`</svg>`;
}
function divPlot(){
  const W=520,H=198,L=56,Rt=500,T=8,B=H-30; const X=g=>L+(Rt-L)*g/15, Y=v=>B-(B-T)*v;
  let s=`<svg width="${W}" height="${H}">`;
  [0,.5,1].forEach(v=>{ s+=`<line class="gr" x1="${L}" x2="${Rt}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-8}" y="${Y(v)+6}" text-anchor="end">${v}</text>`; });
  [0,3,6,9,12,15].forEach(g=>{ s+=`<text x="${X(g)}" y="${H-10}" text-anchor="middle">${g}</text>`; });
  s+=`<path d="${linePath(HIST.div,X,Y,CUR_GEN,LAST_GEN)}" fill="none" stroke="var(--s7)" stroke-width="2" opacity=".3"/><path d="${linePath(HIST.div,X,Y,0,CUR_GEN)}" fill="none" stroke="var(--s7)" stroke-width="2.5"/>`;
  HIST.div.forEach((v,g)=>{ s+=`<circle cx="${X(g)}" cy="${Y(v)}" r="5" fill="var(--s7)" stroke="var(--surface)" stroke-width="2" opacity="${g<=CUR_GEN?1:.3}"/>`; });
  s+=`<line x1="${X(CUR_GEN)}" x2="${X(CUR_GEN)}" y1="${T}" y2="${B}" stroke="var(--ink)" stroke-width="2"/>`;
  return s+`</svg>`;
}
function alleleStrip(){
  const fr=[.5,.75,.25,.25,.5];
  return `<div class="row" style="gap:10px;align-items:flex-end;height:120px;padding:0 14px">${fr.map((v,k)=>`<div style="flex:1;text-align:center"><div style="height:${Math.round(v*80)+6}px;margin:0 8px;border:2px solid var(--ink2);background:linear-gradient(to top, var(--seq4) 100%, transparent)"></div><div style="font-size:19px;font-weight:700">${v.toFixed(2)}</div><div class="note" style="font-size:17px">gene ${k+1}</div></div>`).join('')}</div>`;
}
function bottom(){
  return `<div class="panel" style="${box(G.fit)}"><div class="ph" style="padding:6px 16px 4px"><h2 style="font-size:20px">Fitness</h2><span class="r" style="font-size:18px"><b style="color:var(--ink)">●</b> average &nbsp;<b style="color:var(--ink)">■</b> best of gen. &nbsp;<b style="color:var(--ink)">▲</b> best so far &nbsp;▒ min–max</span></div><div style="padding:0 6px">${fitnessPlot()}</div></div>
  <div class="panel" style="${box(G.div)}"><div class="ph" style="padding:6px 16px 4px"><h2 style="font-size:20px">Diversity</h2><span class="r" style="font-size:18px">mean pairwise Hamming, 0–1</span></div><div style="padding:0 6px">${divPlot()}</div></div>
  <div class="panel" style="${box(G.allele)}"><div class="ph" style="padding:6px 16px 4px"><h2 style="font-size:20px">Share of 1s per gene</h2><span class="r" style="font-size:18px">4 of 4 distinct</span></div>${alleleStrip()}
    <div class="note" style="padding:0 16px;font-size:18px;line-height:1.25">best now 576 · best so far 576<br>average 292.5 · worst 64 · evaluations 4</div></div>
  ${scrub()}`;
}
function scrub(){
  const x0=200,x1=1640,cw=(x1-x0)/10; // generations 0..9 recorded -> 10 cells
  let s=`<svg width="1920" height="66" style="position:absolute;left:0;top:1014px"><rect x="0" y="0" width="1920" height="66" fill="var(--surface)"/><line x1="0" x2="1920" y1="0.5" y2="0.5" stroke="var(--hair)"/>`;
  s+=`<text class="ink" x="24" y="30" style="font-weight:700;font-size:20px">Run history</text><text x="24" y="54" style="font-size:17px">recorded gens 0–9</text>`;
  s+=`<rect x="${x0}" y="14" width="${x1-x0}" height="12" rx="6" fill="var(--grid)"/><rect x="${x0}" y="14" width="${cw}" height="12" rx="6" fill="var(--acc)"/>`;
  for(let g=0;g<=10;g++){ const x=x0+g*cw; s+=`<line x1="${x}" x2="${x}" y1="10" y2="32" stroke="var(--ink2)" stroke-width="2"/>`; if(g<10) s+=`<text x="${x+cw/2}" y="54" text-anchor="middle" ${g===CUR_GEN?'class="ink" style="font-weight:700"':''}>gen ${g}</text>`; }
  for(let g=0;g<10;g++) for(let k=1;k<6;k++){ const x=x0+g*cw+k*cw/6; s+=`<line x1="${x}" x2="${x}" y1="14" y2="26" stroke="var(--axis)" stroke-width="1.5"/>`; }
  const tx=x0+CUR_GEN*cw+cw*(STATES.__cur||0)/6; s+=`<rect id="thumb" x="${x0+cw*1.0-4}" y="6" width="8" height="28" rx="3" fill="var(--ink)"/>`;
  s+=`<g><rect x="1704" y="10" width="190" height="44" rx="8" fill="none" stroke="var(--ink2)" stroke-width="2"/><text class="ink" x="1799" y="38" text-anchor="middle" style="font-weight:600;font-size:19px">Return to live</text></g>`;
  return s+`</svg>`;
}

/* ---------- parameter drawer + dialog ---------- */
function drawer(){
  const ctl=(l,v,t='')=>`<div class="ctl"><span>${l} ${t}</span><span class="field">${v}</span></div>`;
  return `<div id="drawer"><div class="dh"><span>Parameters</span><span style="font-weight:400;font-size:20px">✕ close</span></div>
   <div class="sec"><h4>Run setup <span class="tag reset">↺ needs reset</span></h4>${ctl('Population size N','4')}${ctl('Initialization','Textbook ▾')}${ctl('Seed','42')}</div>
   <div class="sec"><h4>Selection</h4>${ctl('Method','Roulette ▾')}${ctl('Weight chain','Identity')}<div class="help">raw fitness → weight → probability. Steps can be added, removed, reordered. Tournament ignores the chain.</div></div>
   <div class="sec"><h4>Crossover</h4><div class="ctl"><span>Crossover</span><span class="switch"><i></i>ON</span></div>${ctl('Type','One-point ▾')}
     <div class="ctl"><span>Probability pc <span class="tag pend">pending</span></span><span class="field">0.80 → 0.50</span></div>
     <div class="help">Applies <b>per pair</b>. One draw u per pair when the crossover stage runs: recombine if u &lt; pc, else bypass (copies). <i>Applies at the next generation boundary.</i></div></div>
   <div class="sec"><h4>Mutation</h4><div class="ctl"><span>Mutation</span><span class="switch"><i></i>ON</span></div>${ctl('Mode','Per gene ▾')}${ctl('Probability pm','0.05')}
     <div class="help">Per gene: every gene draws u and flips if u &lt; pm. Per individual: one draw decides whether the offspring is mutated at all.</div></div>
   <div class="sec"><h4>Replacement</h4>${ctl('Elites e','1 (25 % of N)')}<div class="ctl"><span>Offspring truncation</span><span class="switch"><i></i>ON</span></div>${ctl('Offspring λ','4')}
     <div class="help">Generate and evaluate λ offspring, keep the best N − e.</div></div>
   <div class="sec" style="border:0"><h4>Stop</h4>${ctl('Generation limit','50')}${ctl('Target fitness reached','961 ✓')}${ctl('Stagnation window','10 gens')}</div></div>`;
}
function dialog(){
  return `<div id="dim"></div><div id="dialog"><h3>Discard generations 2–9?</h3>
   <p>You are viewing generation 1. Changing the crossover probability will continue the run <b>from generation 1</b> with the new setting. Generations 2–9 (already recorded) will be discarded.</p>
   <div class="acts"><button class="btn">Cancel</button><button class="btn primary">Discard 2–9 and apply</button></div></div>`;
}

/* ---------- main ---------- */
function render(st){
  const el=document.getElementById('screen');
  el.innerHTML = topBar(st)+popPanel(st)+offPanel(st)+legendBar()+stagePanel(st)+bottom()+(STATES[st].drawer?drawer()+dialog():'');
  document.querySelectorAll('#chrome [data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===st));
}
function fit(mode){
  const el=document.getElementById('screen'); let s;
  if(mode==='1') s=1; else if(mode==='1366') s=1366/1920; else s=Math.min(innerWidth/1920,(innerHeight-(document.body.classList.contains('shot')?0:40))/1080);
  el.style.transform=`scale(${s})`;
  const h=document.getElementById('holder'); h.style.width=1920*s+'px'; h.style.height=1080*s+'px';
  document.querySelectorAll('#chrome [data-z]').forEach(b=>b.classList.toggle('on',b.dataset.z===mode));
}
function boot(){
  const q=new URLSearchParams(location.hash.slice(1)); let st=q.get('s')||'selection', zoom=q.get('size')||'fit', theme=q.get('theme')||'light';
  if(q.get('shot')) document.body.classList.add('shot');
  G = GEO.B; document.documentElement.dataset.theme = theme;
  const names={selection:'1 Selection',pairing:'2 Pairing',crossover:'3 Crossover',mutation:'4 Mutation',evaluation:'5 Evaluation',replacement:'6 Replacement',drawer:'7 Drawer + notice'};
  document.getElementById('chrome').innerHTML = '<b>STUDIO – chosen direction (hand-made data)</b>'
    +Object.keys(names).map(k=>`<button data-s="${k}">${names[k]}</button>`).join('')
    +'<span class="sep"></span>'+[['light','Light'],['dark','Dark']].map(([k,l])=>`<button data-t="${k}">${l}</button>`).join('')
    +'<span class="sep"></span>'+[['fit','Fit window'],['1','1920×1080']].map(([z,l])=>`<button data-z="${z}">${l}</button>`).join('');
  const mark=()=>document.querySelectorAll('#chrome [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===document.documentElement.dataset.theme));
  document.getElementById('chrome').onclick=e=>{ const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.t){ document.documentElement.dataset.theme=b.dataset.t; mark(); }
    if(b.dataset.s){ st=b.dataset.s; render(st); }
    if(b.dataset.z){ zoom=b.dataset.z; fit(zoom); } };
  render(st); fit(zoom); mark(); addEventListener('resize',()=>fit(zoom));
}
boot();
</script>
